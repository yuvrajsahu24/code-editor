<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code editor</title>
    <link rel="stylesheet" href="code.css">
</head>
<body>
    <div class="main-box">
        <div class="left">
            <div class="code-box">
                <div class="label-box">
                    <label>HTML CODE</label>
                </div>
                <textarea class="tb" id="html-box">

                </textarea>
            </div>
            <div class="code-box">
                <div class="label-box">
                    <label>CSS CODE</label>
                </div>
                <textarea class="tb" id="css-box">
                    
                </textarea>
            </div>
            <div class="code-box">
                <div class="label-box">
                    <label">JS CODE</label>
                </div>
                <textarea class="tb" id="js-box">
                    
                </textarea>
            </div>
        </div>
        <div class="right">
            <div class="label-box">
                <label class="label-box">OUTPUT</label>
            </div>
            <iframe id="output-box"></iframe>
        </div>
    </div>




    <script src="code.js"></script>
</body>
</html>
